name: Extract Nexora Final ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "nexora-professional-fixed-static-export.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          if [ ! -f "nexora-professional-fixed-static-export.zip" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

      - name: Extract ZIP
        run: |
          rm -rf /tmp/nexora
          mkdir -p /tmp/nexora

          unzip -q -o "nexora-professional-fixed-static-export.zip" -d /tmp/nexora

          ROOT="/tmp/nexora/nexora-final"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: nexora-final folder not found inside ZIP."
            exit 1
          fi

          echo "Nexora package found."
          echo "Copying project files..."

          mkdir -p app content lib public

          cp -a "$ROOT/app/." app/
          cp -a "$ROOT/content/." content/
          cp -a "$ROOT/lib/." lib/
          cp -a "$ROOT/public/." public/

          cp -f "$ROOT/package.json" .
          cp -f "$ROOT/tsconfig.json" .
          cp -f "$ROOT/next-env.d.ts" .
          cp -f "$ROOT/next.config.mjs" .
          cp -f "$ROOT/netlify.toml" .
          cp -f "$ROOT/README.md" .
          cp -f "$ROOT/SECURITY.md" .

          echo "Extraction completed successfully."

      - name: Remove uploaded ZIP
        run: |
          rm -f "nexora-professional-fixed-static-export.zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Install final Nexora project"
          git push
