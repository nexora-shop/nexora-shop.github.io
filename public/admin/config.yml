backend:
  name: git-gateway
  branch: main
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: products
    label: Products
    folder: content/products
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Product Name, name: title, widget: string}
      - {label: Main Image, name: image, widget: image}
      - {label: Additional Images, name: images, widget: list, required: false, max: 5}
      - {label: Category, name: category, widget: string}
      - {label: Subcategory, name: subcategory, widget: string, required: false}
      - {label: Short Description, name: description, widget: text}
      - {label: Affiliate Link, name: affiliate_link, widget: string}
      - {label: Publish, name: published, widget: boolean, default: true}
