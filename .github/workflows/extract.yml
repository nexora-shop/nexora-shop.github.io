name: Extract Nexora Fixed ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "nexora-professional-fixed-static-export.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/nexora
          unzip -o nexora-professional-fixed-static-export.zip -d /tmp/nexora

          cp -r /tmp/nexora/* ./

          if [ -d "/tmp/nexora/nexora-professional-fixed-static-export" ]; then
            cp -r /tmp/nexora/nexora-professional-fixed-static-export/* ./
          fi

      - name: Remove ZIP
        run: rm -f nexora-professional-fixed-static-export.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract fixed Nexora project files"
          git push
