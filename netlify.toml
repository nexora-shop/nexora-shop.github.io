[build]
command="npm run build"
publish="out"
[build.environment]
NODE_VERSION="20"
[[headers]]
for="/*"
[headers.values]
X-Frame-Options="SAMEORIGIN"
X-Content-Type-Options="nosniff"
Referrer-Policy="strict-origin-when-cross-origin"
Permissions-Policy="camera=(), microphone=(), geolocation=(), payment=()"
Strict-Transport-Security="max-age=31536000; includeSubDomains; preload"
Content-Security-Policy="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; upgrade-insecure-requests"
[[headers]]
for="/admin/*"
[headers.values]
X-Frame-Options="SAMEORIGIN"
X-Content-Type-Options="nosniff"
Referrer-Policy="no-referrer"
Permissions-Policy="camera=(), microphone=(), geolocation=(), payment=()"
Content-Security-Policy="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'"
[[headers]]
for="/uploads/*"
[headers.values]
X-Content-Type-Options="nosniff"
Cache-Control="public, max-age=31536000, immutable"
